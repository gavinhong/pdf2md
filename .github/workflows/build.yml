name: Native portable builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: python scripts/download_models.py
      - run: python -m pytest -q -m "not integration"
      - run: python scripts/build_portable.py --with-webview --zip
      - uses: actions/upload-artifact@v4
        with:
          name: PDF2MD-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
